# Base compose file
# Contains all that is common between production and development configurations.

services:
  # This can be accessed within the docker network with http://biab-script-server:8080/script/...
  script-server:
    container_name: biab-script-server
    volumes:
      - ${PIPELINE_REPO_PATH}/scripts:/scripts:ro
      - ${PIPELINE_REPO_PATH}/.git:/.git:ro
      - ./script-stubs:/script-stubs:rw
      - ${PIPELINE_REPO_PATH}/pipelines:/pipelines:rw
      - ${PIPELINE_REPO_PATH}/userdata:/userdata:ro
      - ${PIPELINE_REPO_PATH}/output:/output:rw
      - /var/run/docker.sock:/var/run/docker.sock
      - ${K8S_CONFIG_PATH:-/dev/null}:/home/gradle/.kube/config:ro
    expose:
      - "8080"
    user: ${MY_UID}:${DOCKER_GID} # docker group necessary to access docker.sock
    env_file:
      - ${PIPELINE_REPO_PATH}/runner.env
    environment:
      SCRIPT_LOCATION: /scripts
      SCRIPT_STUBS_LOCATION: /script-stubs
      USERDATA_LOCATION: /userdata
      PIPELINES_LOCATION: /pipelines
      OUTPUT_LOCATION: /output
      GIT_LOCATION: /.git
      PIPELINE_REPO_PATH: ${PIPELINE_REPO_PATH}
      USE_RUNNERS: true
      HPC_SSH_CONFIG_FILE: /run/secrets/hpc_ssh_config_file
      HPC_SSH_KEY: /run/secrets/hpc_ssh_key
      HPC_KNOWN_HOSTS_FILE: /run/secrets/hpc_known_hosts_file
    secrets:
      - hpc_ssh_key
      - hpc_known_hosts_file
      - hpc_ssh_config_file

  python-api: # Serves Titiler and a FastAPI app to serve country and region names and geometries
    container_name: biab-python-api
    env_file: # added this to fetch the DISABLE_MY_FILES variable in /pipeline-repo/runner.env
      - ${PIPELINE_REPO_PATH}/runner.env
    volumes:
      - ${PIPELINE_REPO_PATH}/output:/output:ro
      - ${PIPELINE_REPO_PATH}/userdata:/data/userdata:rw  # for user uploads, used in "/manage-files"
      - clamav_data:/var/lib/clamav:rw  # ClamAV signatures, scanning user uploads happens in this container

    user: ${MY_UID}:${DOCKER_GID}
    environment:
      PORT: 8000
      WORKERS_PER_CORE: 1
      TITILER_API_CORS_ORIGINS: "*"
      USERDATA_ROOT: /data/userdata/files
      DISABLE_MY_FILES: ${DISABLE_MY_FILES}
      # The chat bridge, started by startup.sh as a fourth process here rather than as
      # a container of its own: it holds no model and no GPU, so it was a whole
      # container -- and, on Kubernetes, a whole pod per session -- to run an HTTP
      # client. Unset OLLAMA_URL disables the assistant entirely.
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11435}
      # Covers the bridge's non-streaming call to Ollama and its health check.
      #
      # NOTE: it does NOT reach the streaming chat path. `stream_ollama` in the bridge
      # builds its client with a hardcoded `timeout=None`, so /api/chat with
      # stream:true has no timeout at all and this value never applies to it. It stays
      # for the paths it does cover; the broken stream that results is handled by
      # bridge/sitecustomize.py rather than prevented here.
      OLLAMA_PROXY_TIMEOUT: 600000
    expose:
      - "8000"
      - "8001"
      - "8002"
      - "8003"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Watches 8002, the MCP server, because that is what the chat bridge has to find.
    # The bridge connects once at startup and never retries: lose that race and it comes
    # up with zero tools and stays that way, which reads to the user as an assistant
    # that has forgotten how to do anything. startup.sh backgrounds the MCP server
    # behind titiler and builds its toolset from the OpenAPI spec, so it is reliably the
    # last to listen -- hence the long start_period, during which failures do not count
    # against retries.
    #
    # Now that the bridge runs inside this container, the race is startup.sh's to lose
    # and it waits on 8002 itself. This check is left as the outside view of the same
    # condition: it is what tells you from `docker compose ps` that the assistant's
    # backend is up.
    #
    # 406 is the MCP app refusing a bare GET, which is the answer we want: it proves the
    # right server is listening, so the check only needs curl to reach it, not to be
    # given a status it likes.
    #
    # This does make the container report unhealthy if the MCP server dies, which
    # startup.sh deliberately treats as non-fatal. Nothing acts on that: gateway keeps
    # the short form of depends_on and starts regardless, and compose does not restart
    # on unhealthy. The tiler, the region API and the file manager go on serving
    # exactly as before.
    healthcheck:
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://localhost:8002/mcp"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s

  runner-conda:
    container_name: biab-runner-conda
    volumes:
      - ${PIPELINE_REPO_PATH}/scripts:/scripts:ro
      - ./script-stubs:/script-stubs:ro
      - ${PIPELINE_REPO_PATH}/userdata:/userdata:ro
      - ${PIPELINE_REPO_PATH}/output:/output:rw
      - ${PIPELINE_REPO_PATH}/runner.env:/runner.env:ro
    user: ${MY_UID}:${DOCKER_GID}
    environment:
      PYTHONUNBUFFERED: 1
      SCRIPT_LOCATION: /scripts
      USERDATA_LOCATION: /userdata
      OUTPUT_LOCATION: /output

  runner-julia:
    container_name: biab-runner-julia
    volumes:
      - ${PIPELINE_REPO_PATH}/scripts:/scripts:ro
      - ./script-stubs:/script-stubs:ro
      - ${PIPELINE_REPO_PATH}/userdata:/userdata:ro
      - ${PIPELINE_REPO_PATH}/output:/output:rw
      - ${PIPELINE_REPO_PATH}/runner.env:/runner.env:ro
    user: ${MY_UID}:${DOCKER_GID}
    environment:
      SCRIPT_LOCATION: /scripts
      USERDATA_LOCATION: /userdata
      OUTPUT_LOCATION: /output

  gateway:
    container_name: biab-gateway
    ports:
      - "${HTTP_ADDRESS:-127.0.0.1}:${HTTP_PORT:-80}:80"
    volumes:
      - ${GATEWAY_CONFIG}:/etc/nginx/conf.d:ro
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - ${PIPELINE_REPO_PATH}/output:/static/output:ro
      - ${PIPELINE_REPO_PATH}/userdata:/static/userdata:ro
      - ${PIPELINE_REPO_PATH}/scripts:/static/scripts:ro
    depends_on:
      - script-server
      - python-api

secrets:
  hpc_ssh_key:
    file: $HPC_SSH_KEY
  hpc_known_hosts_file:
    file: $HPC_KNOWN_HOSTS_FILE
  hpc_ssh_config_file:
    file: $HPC_SSH_CONFIG_FILE

# added this to prevent downloading large files every time docker restarts
volumes:
  clamav_data: