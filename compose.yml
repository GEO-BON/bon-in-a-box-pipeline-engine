# Base compose file
# Contains all that is common between production and development configurations.

services:
  # This can be accessed within the docker network with http://biab-script-server:8080/script/...
  script-server:
    container_name: biab-script-server
    volumes:
      - ${PIPELINE_REPO_PATH}/scripts:/scripts:ro
      - ${PIPELINE_REPO_PATH}/.git:/.git:ro
      - ./script-stubs:/script-stubs:rw
      - ${PIPELINE_REPO_PATH}/pipelines:/pipelines:rw
      - ${PIPELINE_REPO_PATH}/userdata:/userdata:ro
      - ${PIPELINE_REPO_PATH}/output:/output:rw
      - /var/run/docker.sock:/var/run/docker.sock
      - ${K8S_CONFIG_PATH:-/dev/null}:/home/gradle/.kube/config:ro
    expose:
      - "8080"
    user: ${MY_UID}:${DOCKER_GID} # docker group necessary to access docker.sock
    env_file:
      - ${PIPELINE_REPO_PATH}/runner.env
    environment:
      SCRIPT_LOCATION: /scripts
      SCRIPT_STUBS_LOCATION: /script-stubs
      USERDATA_LOCATION: /userdata
      PIPELINES_LOCATION: /pipelines
      OUTPUT_LOCATION: /output
      GIT_LOCATION: /.git
      PIPELINE_REPO_PATH: ${PIPELINE_REPO_PATH}
      USE_RUNNERS: true
      HPC_SSH_CONFIG_FILE: /run/secrets/hpc_ssh_config_file
      HPC_SSH_KEY: /run/secrets/hpc_ssh_key
      HPC_KNOWN_HOSTS_FILE: /run/secrets/hpc_known_hosts_file
      # ⚠️ python-api's flag, repeated here only so GET /api/status can report the
      # whole feature set from one endpoint -- script-server cannot ask python-api
      # anything. It MUST match the value on python-api below, or the UI reports a
      # confident lie about this instance. DISABLE_MY_FILES needs no line: both
      # services already read the same runner.env above.
      CLAMAV_ADDRESS: ${CLAMAV_ADDRESS:-}
    secrets:
      - hpc_ssh_key
      - hpc_known_hosts_file
      - hpc_ssh_config_file

  python-api: # Serves Titiler and a FastAPI app to serve country and region names and geometries
    container_name: biab-python-api
    env_file:
      - ${PIPELINE_REPO_PATH}/runner.env
    volumes:
      - ${PIPELINE_REPO_PATH}/output:/output:ro
      # userdata is writable for user uploads, used in "/manage-files"
      - ${PIPELINE_REPO_PATH}/userdata:/data/userdata:rw  

    user: ${MY_UID}:${DOCKER_GID}
    environment:
      PORT: 8000
      WORKERS_PER_CORE: 1
      TITILER_API_CORS_ORIGINS: "*"
      USERDATA_ROOT: /data/userdata/files
      # The shared clamd. Blank -- the default -- means uploads are saved WITHOUT
      # being scanned; set, main_api.py fails CLOSED and an unreachable scanner
      # refuses the upload. See the antivirus block in main_api.py.
      CLAMAV_ADDRESS: ${CLAMAV_ADDRESS:-}
      DISABLE_MY_FILES: ${DISABLE_MY_FILES}
      # The chat bridge, started by startup.sh as a fourth process.
      # Unset OLLAMA_URL disables the assistant entirely.
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11435}
      # Covers the bridge's non-streaming call to Ollama and its health check.
      #
      # NOTE: it does NOT reach the streaming chat path. `stream_ollama` in the bridge
      # builds its client with a hardcoded `timeout=None`, so /api/chat with
      # stream:true has no timeout at all and this value never applies to it. It stays
      # for the paths it does cover; the broken stream that results is handled by
      # bridge/sitecustomize.py rather than prevented here.
      OLLAMA_PROXY_TIMEOUT: 600000
    expose:
      - "8000"
      - "8001"
      - "8002"
      - "8003"
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # Bare GET should be refused by MCP server with 406 once all tooling loaded, 
    # proving its listening. 
    # This check tells you from `docker compose ps` that the assistant's backend is up.
    #
    # This does make the container report unhealthy if the MCP server dies, which
    # startup.sh deliberately treats as non-fatal. The rest of the python api will
    # continue working.
    healthcheck:
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://localhost:8002/mcp"]
      # First 90s, run every 5s (server is booting and should soon become healthy)
      # After that, run every 5 minutes.
      interval: 5m
      start_interval: 5s
      timeout: 5s
      retries: 3
      start_period: 90s

  runner-conda:
    container_name: biab-runner-conda
    volumes:
      - ${PIPELINE_REPO_PATH}/scripts:/scripts:ro
      - ./script-stubs:/script-stubs:ro
      - ${PIPELINE_REPO_PATH}/userdata:/userdata:ro
      - ${PIPELINE_REPO_PATH}/output:/output:rw
      - ${PIPELINE_REPO_PATH}/runner.env:/runner.env:ro
    user: ${MY_UID}:${DOCKER_GID}
    environment:
      PYTHONUNBUFFERED: 1
      SCRIPT_LOCATION: /scripts
      USERDATA_LOCATION: /userdata
      OUTPUT_LOCATION: /output

  runner-julia:
    container_name: biab-runner-julia
    volumes:
      - ${PIPELINE_REPO_PATH}/scripts:/scripts:ro
      - ./script-stubs:/script-stubs:ro
      - ${PIPELINE_REPO_PATH}/userdata:/userdata:ro
      - ${PIPELINE_REPO_PATH}/output:/output:rw
      - ${PIPELINE_REPO_PATH}/runner.env:/runner.env:ro
    user: ${MY_UID}:${DOCKER_GID}
    environment:
      SCRIPT_LOCATION: /scripts
      USERDATA_LOCATION: /userdata
      OUTPUT_LOCATION: /output

  gateway:
    container_name: biab-gateway
    ports:
      - "${HTTP_ADDRESS:-127.0.0.1}:${HTTP_PORT:-80}:80"
    volumes:
      - ${GATEWAY_CONFIG}:/etc/nginx/conf.d:ro
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - ${PIPELINE_REPO_PATH}/output:/static/output:ro
      - ${PIPELINE_REPO_PATH}/userdata:/static/userdata:ro
      - ${PIPELINE_REPO_PATH}/scripts:/static/scripts:ro
    depends_on:
      - script-server
      - python-api

secrets:
  hpc_ssh_key:
    file: $HPC_SSH_KEY
  hpc_known_hosts_file:
    file: $HPC_KNOWN_HOSTS_FILE
  hpc_ssh_config_file:
    file: $HPC_SSH_CONFIG_FILE
