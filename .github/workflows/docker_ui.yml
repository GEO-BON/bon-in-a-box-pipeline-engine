name: Publish UI to Github Packages
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - edge
      - '*staging'
    paths:
      - "ui/**"
      - "viewer/**"
      - "Dockerfile.gateway.prod"
      - ".github/workflows/docker_ui.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: gateway

jobs:

  prepare:
    runs-on: ubuntu-latest
    outputs:
      repo_slug: ${{ steps.slug.outputs.repo_slug }}
      tag_version: ${{ steps.set_versions.outputs.tag_version }}
      date: ${{ steps.set_versions.outputs.date }}
    steps:
      - name: Compute lowercase GHCR slug
        id: slug
        shell: bash
        run: |
          echo "repo_slug=ghcr.io/${GITHUB_REPOSITORY@L}" >> "$GITHUB_OUTPUT"

      - name: Check out the repo
        uses: actions/checkout@v6
        with:
          sparse-checkout: 'version.txt'
          sparse-checkout-cone-mode: false

      - name: Read versions
        id: set_versions
        run: |
          echo "date=$(date +'%Y-%m-%d %R')" >> "$GITHUB_OUTPUT"

          biab_version=$(cat version.txt)
          if [ "${{ github.ref_name }}" == "main" ]; then
            echo "tag_version=$biab_version" >> "$GITHUB_OUTPUT"
          else
            if [ "${{ github.ref_name }}" == "edge" ]; then
              echo "tag_version=$biab_version-SNAPSHOT" >> "$GITHUB_OUTPUT"
            else
              echo "tag_version=$biab_version-${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            fi
          fi

  build:
    needs: prepare
    env:
      REPO_SLUG: ${{ needs.prepare.outputs.repo_slug }}
      TAG_VERSION: ${{ needs.prepare.outputs.tag_version }}
      DATE: ${{ needs.prepare.outputs.date }}
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          # Get base image platforms with
          # docker buildx imagetools inspect nginxinc/nginx-unprivileged | grep Platform
          # Excluding windows/amd64 for now since we would need a separate builder.
          # Excluding linux/386 since this points to old 32-bit processor machines and it fails to compile.
          - platform: linux/amd64
            runs_on: ubuntu-latest
            arch_tag: amd64
          - platform: linux/arm64
            runs_on: ubuntu-24.04-arm
            arch_tag: arm64
          # - platform: linux/arm/v7
          # - platform: linux/386
          # - platform: linux/ppc64le
          # - platform: linux/riscv64
          # - platform: linux/s390x
    runs-on: ${{ matrix.runs_on }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the repo
        uses: actions/checkout@v6

      - name: Log in to GitHub Packages
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container # compatible for caching to GHA/registry

      - name: Extract metadata (tags, labels) for Docker
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REPO_SLUG }}/${{ env.IMAGE_NAME }}
          tags: |
            # In case we want to replicate a specific legacy setup
            type=sha,value=${{ github.sha }}-${{ matrix.arch_tag }}
          labels: |
            org.opencontainers.image.licenses=GPL-v3
            org.opencontainers.image.title=BON in a Box Gateway

      - name: Build and push Docker image per architecture
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.gateway.prod
          platforms: ${{ matrix.platform }}
          build-args: |
            BIAB_VERSION=${{ env.TAG_VERSION }} (${{ env.DATE }})
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REPO_SLUG }}/${{ env.IMAGE_NAME }}:buildcache-${{ matrix.arch_tag }}
          cache-to: type=registry,ref=${{ env.REPO_SLUG }}/${{ env.IMAGE_NAME }}:buildcache-${{ matrix.arch_tag }},mode=max

  manifest:
    runs-on: ubuntu-latest
    needs: [build, prepare]
    env:
      REPO_SLUG: ${{ needs.prepare.outputs.repo_slug }}
      TAG_VERSION: ${{ needs.prepare.outputs.tag_version }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container # compatible for caching to GHA/registry

      - name: Create and push manifest
        run: |
          TAG_MAIN="${{ github.ref_name == 'main' && 'latest' || github.ref_name }}"
          TAG_VERSION="${{ env.TAG_VERSION }}"
          BASE="${{ env.REPO_SLUG }}/${{ env.IMAGE_NAME }}"

          docker buildx imagetools create \
            -t "${BASE}:${TAG_MAIN}" \
            -t "${BASE}:${TAG_VERSION}" \
            -t "${BASE}:sha-${{ github.sha }}" \
            "${BASE}:${{ github.sha }}-amd64" \
            "${BASE}:${{ github.sha }}-arm64"
