name: UI tests

on:
  push:
    paths:
      - "ui/**"
      - ".github/workflows/ui_tests.yml"
  pull_request:
    paths:
      - "ui/**"
      - ".github/workflows/ui_tests.yml"

jobs:
  ui-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
