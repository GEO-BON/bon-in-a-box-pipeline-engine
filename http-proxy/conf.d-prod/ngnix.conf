# Modification must be reflected in conf.d folder as well!
server {

    listen 80;
    server_name boninabox.com;

    # Signed-in identity, for the UI's top menu. Proxied so the browser sees it as
    # same-origin: the session cookie is scoped to .bee.geobon.org and rides along
    # here, whereas calling the auth host directly would be cross-origin, get no
    # Access-Control-Allow-Origin back, and send no cookie at all.
    #
    # Exact match, not a /oauth2/ prefix: /oauth2/start and /oauth2/callback must
    # stay on the auth host, since that is the redirect URI registered with Keycloak.
    location = /oauth2/userinfo {
        proxy_pass https://auth.bee.geobon.org/oauth2/userinfo;
        proxy_set_header Host auth.bee.geobon.org;
        proxy_ssl_server_name on;
        proxy_pass_request_body off;
    }

    location /openEO/ {
        proxy_pass http://biab-script-server:8080/openEO/;
        add_header Access-Control-Allow-Origin *;
    }

    location /script/ {
        proxy_pass http://biab-script-server:8080/script/;
        add_header Access-Control-Allow-Origin *;
    }

    location /scripts/ {
        root /static/;
        add_header Access-Control-Allow-Origin *;
    }

    location /pipeline/ {
        proxy_pass http://biab-script-server:8080/pipeline/;
        add_header Access-Control-Allow-Origin *;
    }

    location /hpc/ {
        proxy_pass http://biab-script-server:8080/hpc/;
    }

    location /api/ {
        proxy_pass http://biab-script-server:8080/api/;
    }

    location /tiler/ {
        proxy_pass http://biab-python-api:8000/;
    }

    # catching file manager backend traffic
    location /fm-api/ {
        client_max_body_size 10G;
        proxy_pass http://biab-python-api:8001/fm-api/;
        add_header Access-Control-Allow-Origin *;
    }

    location /region/ {
        proxy_pass http://biab-python-api:8001/region/;
    }

    # The chat assistant's system prompt, assembled from the MCP server's guides.
    location /assistant/ {
        proxy_pass http://biab-python-api:8001/assistant/;
        # So the prompt's links point at the instance the user is actually on.
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Access-Control-Allow-Origin *;
    }

    location /output/ {
        root /static/;
        add_header Access-Control-Allow-Origin *;
    }

    location /userdata {
    	root /static/;
        add_header Access-Control-Allow-Origin *;
    }

    location /viewer/ {
        index index.html index.htm;
        # Added this for compatibility with react-router.
        # see https://stackoverflow.com/a/43557288/3519951
        # see also https://stackoverflow.com/a/46521681/3519951
        try_files $uri /viewer/index.html =404;
        add_header Access-Control-Allow-Origin *;
    }

    location / {
        index index.html index.htm;
        # Added this for compatibility with react-router.
        # see https://stackoverflow.com/a/43557288/3519951
        # see also https://stackoverflow.com/a/46521681/3519951
        try_files /ui/$uri /ui/index.html =404;
        add_header Access-Control-Allow-Origin *;
    }

    # The chat assistant. The bridge serves Ollama's own API, so the UI calls
    # /llm/api/chat -- NOT /api/chat, because /api/ above is already script-server's.
    # The trailing slash on proxy_pass is what strips the /llm prefix back off.
    #
    # 8003 on python-api, not a container of its own: startup.sh runs the bridge as a
    # fourth process there. Nothing answers here when OLLAMA_URL is unset.
    location /llm/ {
        proxy_pass http://biab-python-api:8003/;
        proxy_http_version 1.1;

        # SSE. Without buffering off, nginx accumulates the whole response and the
        # reply lands in one block at the end instead of streaming token by token.
        proxy_buffering off;
        proxy_cache off;
        # One turn is several generations plus tool round trips, and the shared Ollama
        # serialises requests, so a turn can wait a long time before its first token.
        # Kept under the bridge's own OLLAMA_PROXY_TIMEOUT of 600000ms.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        add_header Access-Control-Allow-Origin *;
    }
}
