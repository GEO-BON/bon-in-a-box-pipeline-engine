# Modification must be reflected in conf.d-prod folder as well!
server {

    listen 80;
    server_name boninabox.com;

    # Signed-in identity, for the UI's top menu. Proxied so the browser sees it as
    # same-origin: the session cookie is scoped to .bee.geobon.org and rides along
    # here, whereas calling the auth host directly would be cross-origin, get no
    # Access-Control-Allow-Origin back, and send no cookie at all.
    #
    # Exact match, not a /oauth2/ prefix: /oauth2/start and /oauth2/callback must
    # stay on the auth host, since that is the redirect URI registered with Keycloak.
    location = /oauth2/userinfo {
        proxy_pass https://auth.bee.geobon.org/oauth2/userinfo;
        proxy_set_header Host auth.bee.geobon.org;
        proxy_ssl_server_name on;
        proxy_pass_request_body off;
    }

    location /openEO/ {
        proxy_pass http://biab-script-server:8080/openEO/;
        add_header Access-Control-Allow-Origin *;
    }

    location /script/ {
        proxy_pass http://biab-script-server:8080/script/;
        add_header Access-Control-Allow-Origin *;
    }

    location /scripts/ {
        root /static/;
        add_header Access-Control-Allow-Origin *;
    }

    location /pipeline/ {
        proxy_pass http://biab-script-server:8080/pipeline/;
        add_header Access-Control-Allow-Origin *;
    }

    location /hpc/ {
        proxy_pass http://biab-script-server:8080/hpc/;
    }

    location /api/ {
        proxy_pass http://biab-script-server:8080/api/;
    }

    ## Server to use when making changes to the OpenAPI specification. (dev only)
    location /swagger/ {
        proxy_pass http://swagger_ui:8080/swagger/;
    }

    location /tiler/ {
        proxy_pass http://biab-python-api:8000/;
    }

    # catching file manager backend traffic
    location /fm-api/ {
        client_max_body_size 10G;
        proxy_pass http://biab-python-api:8001/fm-api/;
        add_header Access-Control-Allow-Origin *;
    }

    location /region/ {
        proxy_pass http://biab-python-api:8001/region/;
    }

    location / {
        proxy_pass http://biab-ui:3000;
        proxy_http_version 1.1;

        # Enable hot reloading for dev server
        # https://stackoverflow.com/a/69079753/3519951
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        add_header Access-Control-Allow-Origin *;
        # --- end hot reloading
    }

    location /output/ {
        root /static/;
        add_header Access-Control-Allow-Origin *;
    }

    location /userdata {
    	root /static/;
        add_header Access-Control-Allow-Origin *;
    }

    location /viewer/ {
        proxy_pass http://biab-viewer:5173/viewer/;
        #index index.html index.htm;
        # Added this for compatibility with react-router.
        # see https://stackoverflow.com/a/43557288/3519951
        #try_files $uri /index.html;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        add_header Access-Control-Allow-Origin *;
    }

    location /copilotkit {
        proxy_pass http://chat-api:4000/copilotkit;
        proxy_http_version 1.1;

        # Enable hot reloading for dev server
        # https://stackoverflow.com/a/69079753/3519951
        proxy_set_header Upgrade "";
        proxy_set_header Connection "";
        add_header Access-Control-Allow-Origin *;
        # --- end hot reloading

        # SSE support for streaming responses
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }

    location /mcp {
        proxy_pass http://biab-python-api:8002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Access-Control-Allow-Origin *;
    }
}
