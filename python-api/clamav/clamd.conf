# clamd config for running inside the python-api container.
# Deliberately minimal: this replaces the config generated by the Debian package,
# whose "User clamav" directive breaks when the container runs as ${MY_UID}.

DatabaseDirectory /var/lib/clamav
PidFile /run/clamav/clamd.pid
TemporaryDirectory /tmp

# Loopback TCP rather than a unix socket: keeps ClamdNetworkSocket in main_api.py unchanged.
# Not published anywhere, this port only exists inside the container.
TCPSocket 3310
TCPAddr 127.0.0.1

# No LogFile, so that clamd logs to stdout and shows up in `docker logs biab-python-api`.
Foreground true
LogTime true

# clamd now shares a container with titiler and gunicorn, so keep its footprint modest.
# ConcurrentDatabaseReload would otherwise hold two copies of the signatures during a
# freshclam update, roughly doubling resident memory.
MaxThreads 2
ConcurrentDatabaseReload false

# The gateway accepts uploads up to 10G, well over clamd's 25M default for streams.
# Anything past these limits is not scanned at all, so they are set generously.
MaxScanSize 1G
MaxFileSize 1G
StreamMaxLength 1G
