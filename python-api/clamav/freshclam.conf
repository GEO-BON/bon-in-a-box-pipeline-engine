# freshclam config for running inside the python-api container.
# As with clamd.conf, this replaces the Debian-generated file: its "DatabaseOwner clamav"
# directive fails when the container runs as ${MY_UID}.

DatabaseDirectory /var/lib/clamav

# Required: freshclam refuses to start without a mirror to pull from.
DatabaseMirror database.clamav.net

# No UpdateLogFile, so that updates are logged to stdout.
# No NotifyClamd either: the first update runs before clamd is up, so notifying only
# produces a confusing "connection refused". clamd's SelfCheck reloads changed
# signatures on its own within 10 minutes.

# Twice a day is plenty and keeps the signature mirror happy.
Checks 2
