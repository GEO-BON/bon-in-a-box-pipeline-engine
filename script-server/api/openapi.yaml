openapi: 3.0.3
info:
  title: BON in a Box - Script service
  contact:
    email: jean-michel.lord@mcgill.ca
  version: 1.0.0
servers:
  - url: http://localhost/
    description: script service
tags:
  - name: placeholder
    description: We could use tags
paths:
  /{type}/list:
    get:
      summary: Get a list of available steps of given type and their names.
      operationId: getListOf
      parameters:
        - $ref: "#/components/parameters/stepType"
      responses:
        "200":
          description: Map of step description files to their names.
            Script description files are located in the /script folder.
            Pipeline description files are located in the /pipeline folder.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
                example:
                  {
                    "SHI.yml": "Species Habitat Index",
                    "Folder>SDM.yml": "Species distribution model",
                  }
  /api/history:
    get:
      summary: Get the history of runs for all pipelines on this server, or using pagination with start and limit.
      operationId: getHistory
      parameters:
        - name: start
          in: query
          description: Start index for pagination
          required: false
          schema:
            type: integer
            format: int32
        - name: limit
          in: query
          description: Limit the number of results
          required: false
          schema:
            type: integer
            format: int32
        - name: keyword
          in: query
          description: Filter search based on keyword. This applies to the script/pipeline names and their inputs.
          required: false
          schema:
            type: string
        - name: filterStatus
          in: query
          description: Filter option based on pipeline status. The default value is "all" when null.
          required: false
          schema:
            type: array
            items:
              type: string
              enum: [all, none, running, error, cancelled, completed]
      responses:
        "200":
          description: |
            An object containing two lists: the currently running pipelines,
            and the finished pipelines, with their inputs and status. The list
            contains exclusively runs from this instance.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    runId:
                      description: Where to find the pipeline outputs in ./output folder.
                      type: string
                      example: path>to>script>hash
                    type:
                      description: If it's a script or a pipeline
                      type: string
                      enum: [script, pipeline]
                      example: pipeline
                    startTime:
                      description: UTC date and time when the run was started
                      type: string
                      format: date-time
                      example: 2024-01-01 T 00:00
                    status:
                      description: Information on the completion status
                      type: string
                      enum: [running, error, cancelled, completed]
                    inputs:
                      description: Inputs that were given to the pipeline form for this run.
                      type: object
                example:
                  [
                    {
                      runId: "path>to>script>hash",
                      type: "script",
                      startTime: "2024-01-01 00:00",
                      inputs: {
                        input1: "value",
                        input2: "value"
                      },
                      status: "completed",
                    },
                  ]

  /pipeline/save/{filename}:
    post:
      summary: Save a json file to the pipeline folder.
      operationId: savePipeline
      parameters:
        - name: filename
          in: path
          description: The name of the JSON file (without extension).
          required: true
          schema:
            type: string
      requestBody:
        description: Content of pipeline.json to save
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: File saved (check body for pipeline validation errors)
          content:
            text/plain:
              schema:
                type: string
                x-content-type: text/plain
              examples:
                success:
                  value: saved
                warning:
                  value: |
                    Pipeline saved with errors:
                    helloWorld>helloPython.yml@0: Wrong type "text" for input "some_int", "int" expected.
        default:
          description: |
            An error occurred, check body for details.
            Possible errors are server config blocking save API, invalid json file, IO errors.
          content:
            text/plain:
              schema:
                type: string
                x-content-type: text/plain
              example:
                503:
                  value: |
                    This server does not allow "Save to server" API.
                    Use "Save to clipboard" and submit file through git.
  /{type}/{descriptionPath}/info:
    get:
      tags: []
      summary: Get metadata about this script or pipeline.
      operationId: getInfo
      parameters:
        - $ref: "#/components/parameters/stepType"
        - $ref: "#/components/parameters/descriptionPath"
      responses:
        "200":
          description: Returns the metadata, in JSON format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/info"
        "400":
          description: Bad request
        "404":
          description: Step not found
  /pipeline/{descriptionPath}/get:
    get:
      summary: Get JSON file that describes the pipeline.
      operationId: getPipeline
      parameters:
        - $ref: "#/components/parameters/descriptionPath"
      responses:
        "200":
          description: Returns the complete pipeline, in JSON format
          content:
            application/json:
              schema:
                type: object
                nullable: false
              example:
                {
                  "nodes":
                    [
                      {
                        "id": "0",
                        "type": "io",
                        "position": { "x": 236.8125, "y": 287 },
                        "data":
                          { "descriptionFile": "helloWorld>helloPython.yml" },
                      },
                      {
                        "id": "1",
                        "type": "output",
                        "position": { "x": 593.8125, "y": 289 },
                        "data": { "label": "Output" },
                      },
                    ],
                  "edges":
                    [
                      {
                        "source": "0",
                        "sourceHandle": "increment",
                        "target": "1",
                        "targetHandle": null,
                        "id": "reactflow__edge-0increment-1",
                      },
                    ],
                  "inputs":
                    {
                      "helloWorld>helloPython.yml@0|some_int":
                        {
                          "description": "A number that we will increment",
                          "label": "Some int",
                          "type": "int",
                          "example": 3,
                        },
                    },
                  "outputs":
                    {
                      "helloWorld>helloPython.yml@0|increment":
                        {
                          "description": "bla bla",
                          "label": "A number (input++)",
                          "type": "int",
                          "example": 4,
                        },
                    },
                }
        "400":
          description: Bad request
        "404":
          description: Pipeline not found
  /{type}/{descriptionPath}/run:
    post:
      tags: []
      summary: Runs the script or pipeline matching `descriptionPath`.
      operationId: run
      parameters:
        - $ref: "#/components/parameters/stepType"
        - $ref: "#/components/parameters/descriptionPath"
        - in: query
          name: callback
          schema:
            type: string
          description:
            Optional callback url called upon pipeline completion, only if the call to /run responds 200 OK.
            When receiving the callback, check the outputs or the history to know
            if the pipeline completed successfully.
      requestBody:
        $ref: "#/components/requestBodies/run_input_body"
      responses:
        "200":
          description: Returns the unique ID for this run.
            It corresponds to the unique output folder.
          content:
            text/plain:
              schema:
                type: string
                example: "HelloWorld/Hello World/88204814d39b762f933d67d9a3d68832"
                x-content-type: text/plain
        "400":
          description: Bad request
        "404":
          description: Script or pipeline not found
      callbacks:
        runComplete:
          "{$request.query.callbackUrl}":
            get:
              responses:
                "202":
                  description:
                    Your server implementation should return this HTTP status code
                    if the callback was received successfully.
                "500":
                  description: |
                    500 or any error code can be returned when a problem occurs.
                    Nothing special will be done with it: the current
                    script-server implementation simply discard the error.

  /{type}/{id}/outputs:
    get:
      tags: []
      summary: Get the output folders of the scripts composing this pipeline
      operationId: getOutputFolders
      parameters:
        - $ref: "#/components/parameters/stepType"
        - $ref: "#/components/parameters/runId"
      responses:
        "200":
          description: List of output folders for all the scripts.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
              examples:
                success:
                  value:
                    id1: Folder/Script_ext/88204814d39b762f933d67d9a3d68832
                    id2: Folder/Script2/1a015dccdfb7f639ec32c278506e7c5a
                error:
                  value:
                    error: An error message that happened outside of script execution.
                    id1: Folder/Script_ext/88204814d39b762f933d67d9a3d68832
                    id2: skipped

        "400":
          description: Bad request
        "404":
          description: id not found
  /{type}/{id}/stop:
    get:
      summary: Stop the specified pipeline run.
      operationId: stop
      parameters:
        - $ref: "#/components/parameters/stepType"
        - $ref: "#/components/parameters/runId"
      responses:
        "200":
          description: Pipeline run is stopped (or was already stopped)
        "400":
          description: Bad request
        "404":
          description: id not found
  /api/systemStatus:
    get:
      summary: Returns the system status.
      operationId: getSystemStatus
      responses:
        "200":
          description: System is in good condition.
          content:
            text/plain:
              schema:
                type: string
                x-content-type: text/plain
                example: OK
        "503":
          description: System has a bad configuration
          content:
            text/plain:
              schema:
                type: string
                x-content-type: text/plain
                example: Output folder is improperly configured
  /api/versions:
    get:
      summary: Returns the version of system components.
      operationId: getVersions
      responses:
        "200":
          description: The version of system components.
          content:
            application/json:
              schema:
                type: object
                example:
                  {
                    "UI": "2023-09-07 19:24",
                    "Script server": "2023-09-07 19:24",
                    "Python": "Python 3.10.6",
                    "R runner": "2023-09-07 19:24",
                    "Rscript": "Rscript (R) version 4.2.3 (2023-03-15)",
                    "Julia runner": "2023-09-07 19:24",
                    "Julia": "julia version 1.8.1",
                    "TiTiler": "2023-08-30 15:44",
                  }

  /hpc/status:
    get:
      summary: Get status of HPC connection.
      operationId: getHPCStatus
      responses:
        "200":
          description: The status of the HPC connection.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  properties:
                    state:
                      type: string
                      enum: [NOT_CONFIGURED, CONFIGURED, PREPARING, READY, ERROR]
                    image:
                      type: string
                    message:
                      type: string
                  additionalProperties:
                    type: string
              examples:
                ready:
                  value: {"R":{"state":"READY","image":"geobon/bon-in-a-box@sha256:34acee6db172b55928aaf1312d5cd4d1aaa4d6cc3e2c030053aed1fe44fb2c8e","message":""},"Python":{"state":"READY","image":"geobon/bon-in-a-box@sha256:34acee6db172b55928aaf1312d5cd4d1aaa4d6cc3e2c030053aed1fe44fb2c8e","message":""},"Julia":{"state":"READY","image":"geobon/bon-in-a-box@sha256:5a808f9c89fc23303bd23510f15a9111799cc8ba4e2cd76b1e7797326b4923e7","message":""}}
                not_configured:
                  value: {"R":{"state":"NOT_CONFIGURED"},"Python":{"state":"NOT_CONFIGURED"},"Julia":{"state":"NOT_CONFIGURED"}}
                configured:
                  value: {"R":{"state":"CONFIGURED"},"Python":{"state":"CONFIGURED"},"Julia":{"state":"CONFIGURED"}}
                error:
                  value: {"R":{"state":"ERROR","message":"Some error message for Conda runner"},"Python":{"state":"ERROR","message":"Some error message for Conda runner"},"Julia":{"state":"ERROR","message":"Some error message for Julia runner"}}

  /hpc/prepare:
    get:
      summary:
        Prepare the HPC to run tasks from BON in a Box.
        The apptainer images will be created for every runner.
      responses:
        "200":
          description: |
            The HPC preparation has been launched.
            Watch /hpc/status for changes.

        "503":
          description: |
            Service unavailable: the HPC has not been configured on that host.

  /api/k8s/status:
    get:
      summary: Get status of Kubernetes cluster workers.
      operationId: getK8sStatus
      responses:
        "200":
          description: |
            The status of Kubernetes connection and workers.
            Includes a Configuration entry and one entry per worker node.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  properties:
                    state:
                      type: string
                      enum: [NOT_CONFIGURED, CONFIGURED, PREPARING, READY, ERROR]
                    image:
                      type: string
                    message:
                      type: string
                  additionalProperties:
                    type: string
              examples:
                ready:
                  value: {"Configuration":{"state":"READY","namespace":"default","message":null},"worker-1":{"state":"READY","image":null,"message":null},"worker-2":{"state":"READY","image":null,"message":null}}
                not_configured:
                  value: {"Configuration":{"state":"NOT_CONFIGURED","message":"Kubernetes not configured: ..."}}
                partial_failure:
                  value: {"Configuration":{"state":"ERROR","namespace":"default","message":"At least one worker node has an error"},"worker-1":{"state":"READY","image":null,"message":null},"worker-2":{"state":"ERROR","image":null,"message":"Connection failed"}}

  /api/k8s/prepare:
    get:
      summary:
        Refresh and validate Kubernetes worker readiness for BON in a Box tasks.
      operationId: prepareK8s
      responses:
        "200":
          description: |
            Kubernetes status refresh has been launched.
            Watch /k8s/status for current worker readiness.

        "503":
          description: |
            Service unavailable: Kubernetes has not been configured on that host.

  /region/countries_list:
    get:
      summary: Returns the list of countries from FieldMaps.io with their ISO3 and English names
      operationId: getCountriesList
      responses:
        "200":
          description: Array with list of countries.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  example:
                    {
                      "adm0_name": "Canada",
                      "amd0_src": "CAN",
                      "geometry_bbox":
                        {
                          xmin: -141.0,
                          ymin: 41.676555,
                          xmax: -52.648098,
                          ymax: 83.336212,
                        },
                    }
  /region/regions_list:
    get:
      summary: Returns the list of regions with their ID (adm1_src), Country, English names and bounding box
      operationId: getRegionsList
      parameters:
        - name: country_iso
          in: query
          description: ISO3 code of the country to get the regions for (e.g. "CAN" for Canada)
          required: true
          example: CAN
          schema:
            type: string
      responses:
        "200":
          description: Array with list of regions.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  example:
                    {
                      "adm1_src": "82249235B52639524229375",
                      "adm1_name": "Quebec",
                      "adm0_src": "CAN",
                      "adm0_name": "Canada",
                      "geometry_bbox":
                        {
                          "xmin": -79.76287841796875,
                          "ymin": 44.99136734008789,
                          "xmax": -57.1054801940918,
                          "ymax": 62.58246612548828,
                        },
                    }
        "404":
          description: Country ID not found
  /region/geometry:
    get:
      summary: Returns the geometry of the specified country or region from Fieldmaps.io in GeoJSON format
      operationId: getRegionGeometry
      parameters:
        - name: type
          in: query
          description: Type of region to get the geometry for (country or region)
          required: false
          schema:
            type: string
            enum: [country, region]
            default: country
          example: country
        - name: id
          in: query
          description: ID of the region to get the geometry for (adm0_src or adm1_src), from the UN regions codes
          required: true
          schema:
            type: string
          examples:
            adm0:
              value: LKA
              summary: With country type (adm0), a three-letter code
            adm1:
              value: "82249235B3191732862561"
              summary: With region type (adm1), a series of digits
      responses:
        "200":
          description: Geometry of the region in GeoPackage format.
          content:
            application/geopackage+sqlite3:
              schema:
                type: string
                format: binary
        "404":
          description: Region ID not found
  /fm-api/files:
    get:
      summary: Returns the list of root files and folders uploaded by the user.
      operationId: getRootItems
      responses:
        "200":
          description: Array with list of root files and folders.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                  - id
                  - value
                  - type
                  - size
                  example:
                    {
                      "id": "/test.txt",
                      "value": "test.txt",
                      "type": "file",
                      "size": 0
                    }
  /fm-api/files/{id:path}:
    get:
      summary: Returns the list of files and folders uploaded by the user under a specific subfolder.
      operationId: getSubfolderItems
      responses:
        "200":
          description: Array with list of files and folders under a specific subfolder.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                  - id
                  - value
                  - type
                  - size
                  example:
                    {
                      "id": "/test.txt",
                      "value": "test.txt",
                      "type": "file",
                      "size": 0
                    }
  /fm-api/files/{id}:
    post:
      summary: Creates a file or folder.
      operationId: createItem
      parameters:
        - name: id
          in: path
          required: true
          description: The parent folder path where the new item will be created.
          schema:
            type: string
            example: "file1"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - type
              properties:
                name:
                  type: string
                  description: The name of the new file or folder.
                  example: "new.txt"
                type:
                  type: string
                  enum: [file, folder]
                  description: The type of item to create.
                  example: "file"
      responses:
        "200":
          description: Item successfully created. Returns the metadata.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: object
                    required:
                      - id
                      - name
                      - type
                    properties:
                      id:
                        type: string
                        example: "/file1/new_document.txt"
                      name:
                        type: string
                        example: "new_document.txt"
                      type:
                        type: string
                        enum: [file, folder]
                        example: "file"
        "400":
          description: Missing type or name parameters.
  /fm-api/files/{id}:
    put:
      summary: Renames a file or folder.
      operationId: renameItem
      parameters:
        - name: id
          in: path
          required: true
          description: The current path/id of the file or folder that is being renamed.
          schema:
            type: string
            example: "old_name.txt"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - operation
                - name
              properties:
                operation:
                  type: string
                  enum: [rename]
                  description: The action to perform. Must be set to 'rename'.
                  example: "rename"
                name:
                  type: string
                  description: The new name for the file or folder (including its extension).
                  example: "new_name.txt"
      responses:
        "200":
          description: Item successfully renamed. Returns the updated metadata.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: object
                    required:
                      - id
                      - name
                    properties:
                      id:
                        type: string
                        example: "new_name.txt"
                      name:
                        type: string
                        example: "new_name.txt"
        "400":
          description: Unsupported operation.
        "404":
          description: The file or folder with that ID could not be found.
  /fm-api/files:
    put:
      summary: Moves or copies a file.
      operationId: moveCopyItem
      parameters:

components:
  parameters:
    stepType:
      name: type
      in: path
      description: Script, pipeline or openEO
      required: true
      style: simple
      explode: false
      schema:
        type: string
        enum: [script, pipeline, openEO]
    descriptionPath:
      name: descriptionPath
      in: path
      description: Where to find the step.
        For scripts, paths are relative to the /script folder.
        For pipelines, paths are relative to the /pipeline folder.
      required: true
      style: simple
      explode: false
      schema:
        type: string
    runId:
      name: id
      in: path
      description: |
        Where to find the pipeline or step outputs in ./output folder.
        It also acts as a handle to stop the run.
      required: true
      style: simple
      explode: false
      schema:
        type: string
  schemas:
    info:
      type: object
      properties:
        script:
          type: string
          example: helloR.R
        name:
          type: string
          example: R Example
        description:
          type: string
          example: This sample script shows how it works.
        lifecycle:
          type: object
          properties:
            status:
              type: string
              enum: [in_development, in_review, reviewed, core, deprecated, example]
              default: in_development
            message:
              type: string
          example:
            - status: in_development
            - status: deprecated
              message: Message explaining why it's deprecated and what to choose instead
        author:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                description: Full name of the author
              email:
                type: string
                format: email
                description: Email of the author
              identifier:
                type: string
                description: Full URL of a unique digital identifier such as an ORCID
              role:
                type: string
                description: Role of the author in the contribution. We recommend to use CRediT roles (https://credit.niso.org/)
          example:
            - name: Jane Doe
            - name: John Doe
              email: john.doe@example.org
              identifier: https://orcid.org/0000-0000-0000-0000
              role: Software
        reviewer:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                description: Full name of the reviewer
              email:
                type: string
                format: email
                description: Email of the reviewer
              identifier:
                type: string
                description: Full URL of a unique digital identifier such as an ORCID
          example:
            - name: Jane Doe
            - name: John Doe
              email: john.doe@example.org
              identifier: https://orcid.org/0000-0000-0000-0000
        license:
          type: string
          example: CC BY
        external_link:
          type: string
          example: https://github.com/GEO-BON/biab-2.0
        timeout:
          type: number
          example: 60
        compute:
          type: object
          properties:
            hpc:
              type: boolean
              description: |
                Whether this script is meant to be run on a HPC.
                If true, the script will be run on a HPC when configured, otherwise on kubernetes or locally.
            mem:
              type: string
              example: 30G
              description: Maximum amount of memory allowed before Out Of Memory exception occurs.
            cpus-per-task:
              type: integer
              example: 16
              description: Number of CPUs for this task.
            time:
              type: string
              example: "01:00:00"
              description: Maximum time allowed before timeout, for syntax see https://slurm.schedmd.com/sbatch.html#OPT_time.
        inputs:
          type: object
          additionalProperties:
            type: object
            properties:
              description:
                type: string
                example: scientific name of the species
              label:
                type: string
                example: species names
              weight:
                type: number
                example: 1
                description: The weight is used to sort inputs in the client UI.
              type:
                type: string
                example: text
              options:
                type: array
                items:
                  type: string
                example:
                  - Option 1
                  - Option 2
              properties:
                type: array
                items:
                  type: string
                example:
                  - id
                  - layer
              example:
                example: Glyptemys insculpta
                oneOf:
                  - type: string
                  - type: number
                  - type: boolean
                  - type: array
                    items:
                      oneOf:
                        - type: string
                        - type: number
                        - type: boolean
        outputs:
          type: object
          additionalProperties:
            type: object
            properties:
              description:
                type: string
                example: coordinate of occurances in
              label:
                type: string
                example: occurences
              weight:
                type: number
                example: 1
                description: The weight is used to sort outputs in the client UI.
              type:
                type: string
                example: text/csv
              range:
                type: array
                items:
                  type: number
                minItems: 2
                maxItems: 2
                example: [0, 1]
              options:
                type: array
                items:
