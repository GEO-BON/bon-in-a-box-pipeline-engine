script: assertLocation.py
name: Assert Location
description: "Test python script if it receives a location object."
author:
  - name: Jean-Michel Lord
inputs:
  some_input:
    label: Location
    description: The location body to check. A location is the full object with country, region, CRS and bbox.
    type: location
    example:
      CRS:
        CRSBboxWGS84:
          - -180
          - -90
          - 180
          - 90
        authority: EPSG
        code: 4326
        name: WGS 84
        proj4Def: +proj=longlat +datum=WGS84 +no_defs +type=crs
        unit: degree (supplier to define representation)
        wktDef: >-
          GEOGCS["WGS 84",DATUM["WGS_1984",SPHEROID["WGS
          84",6378137,298.257223563,AUTHORITY["EPSG","7030"]],AUTHORITY["EPSG","6326"]],PRIMEM["Greenwich",0,AUTHORITY["EPSG","8901"]],UNIT["degree",0.0174532925199433,AUTHORITY["EPSG","9122"]],AUTHORITY["EPSG","4326"]]
      bbox:
        - 10.09809
        - 46.65136
        - 12.96664
        - 47.74304
      country:
        ISO3: AUT
        bboxWGS84:
          - 9.530734062194824
          - 46.37230682373047
          - 17.160776138305664
          - 49.020530700683594
        englishName: Austria
      region:
        bboxWGS84:
          - 10.0980873108
          - 46.6513595581
          - 12.9666414261
          - 47.7430381775
        countryEnglishName: Austria
        regionID: 97560089B46292059412713
        regionName: Tirol
outputs:
  the_same:
    label: Same value
    description: The same location as in the inputs.
    type: location
    example:
      CRS:
        CRSBboxWGS84:
          - -180
          - -90
          - 180
          - 90
        authority: EPSG
        code: 4326
        name: WGS 84
        proj4Def: +proj=longlat +datum=WGS84 +no_defs +type=crs
        unit: degree (supplier to define representation)
        wktDef: >-
          GEOGCS["WGS 84",DATUM["WGS_1984",SPHEROID["WGS
          84",6378137,298.257223563,AUTHORITY["EPSG","7030"]],AUTHORITY["EPSG","6326"]],PRIMEM["Greenwich",0,AUTHORITY["EPSG","8901"]],UNIT["degree",0.0174532925199433,AUTHORITY["EPSG","9122"]],AUTHORITY["EPSG","4326"]]
        bbox:
          - 10.09809
          - 46.65136
          - 12.96664
          - 47.74304
        country:
          ISO3: AUT
          bboxWGS84:
            - 9.530734062194824
            - 46.37230682373047
            - 17.160776138305664
            - 49.020530700683594
          englishName: Austria
        region:
          bboxWGS84:
            - 10.0980873108
            - 46.6513595581
            - 12.9666414261
            - 47.7430381775
          countryEnglishName: Austria
          regionID: 97560089B46292059412713
          regionName: Tirol

