script: loadFromStac.R
name: GBIF Heatmap
description: |
  Download raster representing the number of observations in GBIF for each pixel for specific taxonomic groups.
  Source layer can be found on the [GEO BON STAC catalog](https://stac.geobon.org/viewer/).
author:
  - name: Guillaume Larocque
    identifier: https://orcid.org/0000-0002-5967-9156
lifecycle:
  status: core
inputs:
  taxa:
    label: Taxa
    description: taxonomic group for which to retrieve GBIF heatmap
    type: options
    options:
      - reptiles
      - plants
      - mammals
      - birds
      - arthropods
      - amphibians
      - all
    example: plants
  bbox_crs:
    description: Select a bounding box and CRS
    label: Bounding box and CRS
    type: crsBBox
    example:
      bbox_crs:
        bbox:
          - 2313832
          - 931786
          - 2720193
          - 1570189
        CRS:
          name: Canada Lambert Conformal Conic
          authority: ESRI
          code: 102002
          proj4Def: >-
            +proj=lcc +lat_0=40 +lon_0=-96 +lat_1=50 +lat_2=70 +x_0=0 +y_0=0
            +datum=NAD83 +units=m +no_defs +type=crs
          wktDef: >-
            PROJCS["Canada_Lambert_Conformal_Conic",GEOGCS["NAD83",DATUM["North_American_Datum_1983",SPHEROID["GRS
            1980",6378137,298.257222101,AUTHORITY["EPSG","7019"]],AUTHORITY["EPSG","6269"]],PRIMEM["Greenwich",0,AUTHORITY["EPSG","8901"]],UNIT["degree",0.0174532925199433,AUTHORITY["EPSG","9122"]],AUTHORITY["EPSG","4269"]],PROJECTION["Lambert_Conformal_Conic_2SP"],PARAMETER["latitude_of_origin",40],PARAMETER["central_meridian",-96],PARAMETER["standard_parallel_1",50],PARAMETER["standard_parallel_2",70],PARAMETER["false_easting",0],PARAMETER["false_northing",0],UNIT["metre",1,AUTHORITY["EPSG","9001"]],AXIS["Easting",EAST],AXIS["Northing",NORTH],AUTHORITY["ESRI","102002"]]
          unit: null
          CRSBboxWGS84:
            - -141.01
            - 38.21
            - -40.73
            - 86.46
  spatial_res:
    label: Spatial resolution
    description: Integer, spatial resolution of the rasters
    type: float
    example: 1000.0
outputs:
  rasters:
    label: Density raster
    description: Array with output raster path
    type: image/tiff;application=geotiff
